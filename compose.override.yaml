
services:
  ###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432:5432"
  ###< doctrine/doctrine-bundle ###

  adminer:
    image: butopea/adminer
    ports:
      - "7080:8080"
    environment:
      ADMINER_SERVER: database
      ADMINER_DB: app
      ADMINER_USER: app
      ADMINER_DRIVER: pgsql
      ADMINER_PASSWORD: "!ChangeMe!"
      ADMINER_AUTOLOGIN: 1

  ###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
